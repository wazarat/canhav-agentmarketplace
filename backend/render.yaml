services:
  - type: web
    name: canhav-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: INSTANTLY_API_KEY
        sync: false
      - key: INSTANTLY_CAMPAIGN_ID
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # Supabase (Market Map). Values are set in the Render dashboard, not committed here.
      # SUPABASE_URL          : https://<project-ref>.supabase.co
      # SUPABASE_ANON_KEY     : anon JWT — used by /api/market-map/* on the live read path
      # SUPABASE_SERVICE_ROLE_KEY : service-role JWT — only the ingest scripts need this, but
      #                         setting it on Render is harmless and lets us run ad-hoc admin queries
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: "3.11"
